<style>
:root {
  --bg:#080510;--s1:#0f0a1e;--s2:#161028;--card:#130d22;
  --border:rgba(255,255,255,0.06);--text:#ede8ff;--muted:rgba(237,232,255,0.4);
  --dim:rgba(237,232,255,0.18);--accent:#e8445a;--gold:#f0c040;--r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.11;}
.orb1{width:500px;height:500px;background:#e8445a;top:-120px;left:-140px;animation:d1 20s ease-in-out infinite;}
.orb2{width:420px;height:420px;background:#7c3aed;bottom:-80px;right:-100px;animation:d2 25s ease-in-out infinite;}
.orb3{width:280px;height:280px;background:#f0c040;top:45%;left:35%;animation:d3 17s ease-in-out infinite;}
@keyframes d1{0%,100%{transform:translate(0,0);}50%{transform:translate(50px,35px);}}
@keyframes d2{0%,100%{transform:translate(0,0);}50%{transform:translate(-45px,-28px);}}
@keyframes d3{0%,100%{transform:translate(0,0);}50%{transform:translate(-35px,45px);}}

.wrap{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;padding-bottom:170px;}

/* HEADER */
header{padding:18px 16px 0;position:sticky;top:0;z-index:200;background:rgba(8,5,16,0.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;background:linear-gradient(110deg,#f0c040,#e8445a,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand-sub{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;margin-bottom:14px;}
.search-wrap input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:'Noto Sans',sans-serif;}
.search-wrap input::placeholder{color:var(--dim);}

/* TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:13px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:100px;border:1px solid var(--border);background:var(--s2);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all 0.2s;white-space:nowrap;}
.tab:hover{color:var(--text);border-color:rgba(255,255,255,0.14);}
.tab.active{color:#fff;border-color:transparent;background:var(--gc,#e8445a);box-shadow:0 0 18px var(--gg,rgba(232,68,90,0.4));}

/* NOTICE */
.notice{margin:14px 16px 0;padding:11px 14px;background:rgba(240,192,64,0.07);border:1px solid rgba(240,192,64,0.18);border-radius:12px;font-size:11px;color:rgba(240,192,64,0.75);display:flex;align-items:center;gap:8px;}
.notice a{color:var(--gold);}

/* MAIN */
main{padding:18px 16px 8px;}
.sec-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

/* FEATURED STRIP */
.hstrip{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:none;}
.hstrip::-webkit-scrollbar{display:none;}
.fc{flex-shrink:0;width:136px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:fu .4s ease both;}
.fc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,0.45);}
.fc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 20px rgba(232,68,90,0.28);}
.fc img,.fc-ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2);}
.fc-ph{display:flex;align-items:center;justify-content:center;font-size:30px;}
.fc-info{padding:8px 10px 10px;}
.fc-title{font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fc-artist{font-size:10px;color:var(--muted);margin-top:3px;}

/* SONG LIST */
.song-list{display:flex;flex-direction:column;gap:2px;}
.sr{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;cursor:pointer;transition:background .15s;animation:fu .3s ease both;}
.sr:hover{background:var(--s2);}
.sr.on{background:rgba(232,68,90,0.09);border:1px solid rgba(232,68,90,0.18);}
.sr-num{width:22px;text-align:center;font-size:12px;color:var(--dim);flex-shrink:0;}
.sr.on .sr-num{display:none;}
.bars{display:none;gap:2px;align-items:flex-end;height:16px;width:22px;flex-shrink:0;}
.sr.on .bars{display:flex;}
.bars span{display:block;width:3px;background:var(--accent);border-radius:2px;animation:b .75s ease-in-out infinite;}
.bars span:nth-child(1){height:5px;animation-delay:0s;}
.bars span:nth-child(2){height:13px;animation-delay:.12s;}
.bars span:nth-child(3){height:7px;animation-delay:.24s;}
.bars span:nth-child(4){height:15px;animation-delay:.36s;}
@keyframes b{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
.sr img,.sr-ph{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--s2);}
.sr-ph{display:flex;align-items:center;justify-content:center;font-size:20px;}
.sr-meta{flex:1;min-width:0;}
.sr-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-detail{font-size:11px;color:var(--muted);margin-top:2px;}
.sr-dur{font-size:11px;color:var(--dim);flex-shrink:0;}

@keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* SPINNER */
.spinner{display:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;margin:48px auto;}
.spinner.on{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty .ei{font-size:42px;margin-bottom:12px;}
.empty p{font-size:13px;line-height:1.7;}

/* PLAYER */
#player{position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(8,5,16,0.96);backdrop-filter:blur(24px);border-top:1px solid var(--border);transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.3,.64,1);}
#player.open{transform:translateY(0);}
.p-handle{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,0.13);margin:10px auto 0;cursor:pointer;}
.p-mini{display:flex;align-items:center;gap:11px;padding:10px 16px 12px;cursor:pointer;}
.p-thumb{width:42px;height:42px;border-radius:10px;background:var(--s2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.p-thumb img{width:100%;height:100%;object-fit:cover;}
.p-meta{flex:1;min-width:0;}
.p-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-sub{font-size:11px;color:var(--muted);}
.p-ctrls{display:flex;gap:3px;align-items:center;}
.pbtn{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;background:none;color:var(--text);transition:background .2s;}
.pbtn:hover{background:var(--s2);}
.pbtn.play{width:40px;height:40px;background:var(--accent);color:#fff;font-size:13px;}

.p-exp{display:none;padding:0 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom));}
.p-exp.on{display:block;}
.yt-box{border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9;margin-bottom:14px;}
.yt-box iframe{width:100%;height:100%;border:none;display:block;}
.p-etitle{font-size:15px;font-weight:700;margin-bottom:3px;}
.p-esub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.p-ebtns{display:flex;gap:8px;}
.ebtn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-size:12px;font-family:'Noto Sans',sans-serif;cursor:pointer;transition:all .2s;}
.ebtn:hover{background:rgba(255,255,255,0.07);}
.ebtn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
</style>
</head>

    </div>`).join('');
  document.querySelectorAll('.tab').forEach(t=>
    t.addEventListener('click',()=>{ genre=GENRES.find(g=>g.id===t.dataset.id); renderTabs(); load(); }));
}

// LOAD
async function load(q=''){
  const content=document.getElementById('content');
  const spinner=document.getElementById('spinner');
  content.innerHTML=''; spinner.classList.add('on');
  try{
    if(LIVE){
      const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&videoCategoryId=10&q=${encodeURIComponent(q||genre.q)}&key=${YT_KEY}`);
      const d=await r.json();
      if(d.error) throw new Error(d.error.message);
      songs=d.items.map(i=>({
        id:i.id.videoId,
        title:i.snippet.title.replace(/&amp;/g,'&').replace(/&#39;/g,"'"),
        artist:i.snippet.channelTitle,
        thumb:i.snippet.thumbnails.medium?.url,dur:''
      }));
    } else {
      songs = q
        ? Object.values(DEMO).flat().filter(s=>
            s.title.toLowerCase().includes(q.toLowerCase())||
            s.artist.toLowerCase().includes(q.toLowerCase()))
        : (DEMO[genre.id]||[]);
    }
    spinner.classList.remove('on');
    render();
  }catch(e){
    spinner.classList.remove('on');
    content.innerHTML=`<div class="empty"><div class="ei">😔</div><p>Could not load songs.<br><small>${e.message}</small></p></div>`;
  }
}

// RENDER
function render(){
  if(!songs.length){
    document.getElementById('content').innerHTML=`<div class="empty"><div class="ei">🔍</div><p>No songs found.<br>Try a different search.</p></div>`;
    return;
  }
  const feat=songs.slice(0,4), list=songs.slice(4);
  const thumb=(s,cls)=>s.thumb
    ?`<img class="${cls}" src="${s.thumb}" loading="lazy" alt="${s.title}"/>`
    :`<div class="${cls.replace('img','')}-ph" style="aspect-ratio:16/9;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:30px;">${genre.emoji}</div>`;

  document.getElementById('content').innerHTML=`
    <div class="sec-label">${genre.emoji} ${genre.label} — Featured</div>
    <div class="hstrip">${feat.map((s,i)=>`
      <div class="fc ${idx===i?'on':''}" data-i="${i}" style="animation-delay:${i*.07}s">
        ${s.thumb?`<img class="fc-th" src="${s.thumb}" style="width:100%;aspect-ratio:16/9;object-fit:cover;" loading="lazy" alt="${s.title}"/>`:
        `<div class="fc-ph">${genre.emoji}</div>`}
        <div class="fc-info"><div class="fc-title">${s.title}</div><div class="fc-artist">${s.artist}</div></div>
      </div>`).join('')}
    </div>
    <div class="sec-label" style="margin-bottom:12px;">🎵 All Songs (${songs.length})</div>
    <div class="song-list">${list.map((s,i)=>{const ii=i+4;return`
      <div class="sr ${idx===ii?'on':''}" data-i="${ii}" style="animation-delay:${i*.025}s">
        <div class="sr-num">${ii+1}</div>
        <div class="bars"><span></span><span></span><span></span><span></span></div>
        ${s.thumb?`<img src="${s.thumb}" style="width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;" loading="lazy"/>`
          :`<div class="sr-ph">${genre.emoji}</div>`}
        <div class="sr-meta"><div class="sr-title">${s.title}</div><div class="sr-detail">${s.artist}${s.dur?' · '+s.dur:''}</div></div>
        <div class="sr-dur">${s.dur||''}</div>
      </div>`}).join('')}
    </div>`;

  document.querySelectorAll('.fc').forEach(el=>el.addEventListener('click',()=>play(+el.dataset.i)));
  document.querySelectorAll('.sr').forEach(el=>el.addEventListener('click',()=>play(+el.dataset.i)));
}

// PLAY
function play(i){
  idx=i;
  const s=songs[i]; if(!s) return;
  const pt=document.getElementById('pThumb');
  pt.innerHTML=s.thumb?`<img src="${s.thumb}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;"/>`:(genre.emoji);
  document.getElementById('pTitle').textContent=s.title;
  document.getElementById('pSub').textContent=s.artist;
  document.getElementById('peTitle').textContent=s.title;
  document.getElementById('peSub').textContent=s.artist+' · '+genre.label;
  document.getElementById('ytFrame').src=`https://www.youtube.com/embed/${s.id}?autoplay=1&rel=0&modestbranding=1`;
  document.getElementById('ppBtn').textContent='⏸';
  document.getElementById('player').classList.add('open');
  document.getElementById('favBtn').textContent=favs.includes(s.id)?'❤️ Favourited':'🤍 Favourite';
  document.querySelectorAll('.fc,.sr').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
}

// CONTROLS
document.getElementById('prevBtn').addEventListener('click',e=>{e.stopPropagation();if(idx>0)play(idx-1);});
document.getElementById('nextBtn').addEventListener('click',e=>{e.stopPropagation();if(idx<songs.length-1)play(idx+1);});
document.getElementById('ppBtn').addEventListener('click',e=>{
  e.stopPropagation();
  const f=document.getElementById('ytFrame');
  if(f.src.includes('autoplay=1')){f.src=f.src.replace('autoplay=1','autoplay=0');document.getElementById('ppBtn').textContent='▶';}
  else{f.src=f.src.replace('autoplay=0','autoplay=1');document.getElementById('ppBtn').textContent='⏸';}
});
function toggleExp(){
  expanded=!expanded;
  document.getElementById('pExp').classList.toggle('on',expanded);
  document.getElementById('expBtn').textContent=expanded?'🔽':'🔼';
}
document.getElementById('expBtn').addEventListener('click',e=>{e.stopPropagation();toggleExp();});
document.getElementById('pHandle').addEventListener('click',toggleExp);
document.getElementById('pMini').addEventListener('click',toggleExp);
document.getElementById('ytBtn').addEventListener('click',()=>{const s=songs[idx];if(s)window.open(`https://youtu.be/${s.id}`,'_blank');});
document.getElementById('favBtn').addEventListener('click',()=>{
  const s=songs[idx];if(!s)return;
  const i=favs.indexOf(s.id);
  if(i>=0){favs.splice(i,1);document.getElementById('favBtn').textContent='🤍 Favourite';}
  else{favs.push(s.id);document.getElementById('favBtn').textContent='❤️ Favourited';}
  localStorage.setItem('sm_f',JSON.stringify(favs));
});

// SEARCH
let st;
document.getElementById('searchInput').addEventListener('input',e=>{
  clearTimeout(st);const q=e.target.value.trim();
  st=setTimeout(()=>load(q),380);
});

// PWA
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// INIT
renderTabs(); load();
</script>
</body>
</html>
