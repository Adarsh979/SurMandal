<title>SurMandal 🎵 — Bollywood & Marathi Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
:root{
  --bg:#07040f;--s1:#0f0919;--s2:#160e26;--card:#120b20;
  --border:rgba(255,255,255,0.07);--text:#eee8ff;
  --muted:rgba(238,232,255,0.42);--dim:rgba(238,232,255,0.18);
  --accent:#e8445a;--gold:#f0c040;--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* orbs */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.o{position:absolute;border-radius:50%;filter:blur(100px);opacity:.09;}
.o1{width:550px;height:550px;background:#e8445a;top:-150px;left:-180px;animation:da 22s ease-in-out infinite;}
.o2{width:450px;height:450px;background:#7c3aed;bottom:-100px;right:-120px;animation:db 26s ease-in-out infinite;}
.o3{width:300px;height:300px;background:#f0c040;top:40%;left:30%;animation:dc 18s ease-in-out infinite;}
@keyframes da{0%,100%{transform:translate(0,0)}50%{transform:translate(55px,38px)}}
@keyframes db{0%,100%{transform:translate(0,0)}50%{transform:translate(-48px,-30px)}}
@keyframes dc{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,44px)}}

.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;padding-bottom:180px;}

/* HEADER */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(7,4,15,0.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:16px 16px 0;
}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{font-family:'Baloo 2',cursive;font-size:23px;font-weight:800;letter-spacing:-.3px;
  background:linear-gradient(110deg,#f0c040 0%,#e8445a 50%,#a855f7 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.bsub{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:1px;}

/* search */
.sbox{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;margin-bottom:13px;}
.sbox input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:'Noto Sans',sans-serif;}
.sbox input::placeholder{color:var(--dim);}

/* tabs */
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:13px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:7px 13px;
  border-radius:100px;border:1px solid var(--border);background:var(--s2);
  cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);
  transition:all .2s;white-space:nowrap;}
.tab:hover{color:var(--text);border-color:rgba(255,255,255,0.15);}
.tab.on{color:#fff;border-color:transparent;background:var(--gc,#e8445a);
  box-shadow:0 0 18px var(--gg,rgba(232,68,90,.4));}

/* main */
main{padding:18px 16px 8px;}
.slabel{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

/* SONG CARDS - horizontal strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:24px;scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}
.scard{
  flex-shrink:0;width:130px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  animation:fu .4s ease both;
}
.scard:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(0,0,0,.5);}
.scard.on{border-color:var(--accent) !important;box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(232,68,90,.3) !important;}
.scard-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2);}
.scard-ph{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),var(--s1));
  display:flex;align-items:center;justify-content:center;font-size:28px;}
.scard-body{padding:8px 9px 10px;}
.scard-title{font-size:11px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.scard-artist{font-size:10px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* SONG LIST */
.slist{display:flex;flex-direction:column;gap:1px;}
.srow{
  display:flex;align-items:center;gap:11px;padding:9px 10px;
  border-radius:11px;cursor:pointer;transition:background .15s;
  animation:fu .3s ease both;border:1px solid transparent;
}
.srow:hover{background:var(--s2);}
.srow.on{background:rgba(232,68,90,.08);border-color:rgba(232,68,90,.2);}
.snum{width:22px;text-align:center;font-size:12px;color:var(--dim);flex-shrink:0;}
.srow.on .snum{display:none;}
.sbars{display:none;gap:2px;align-items:flex-end;height:16px;width:22px;flex-shrink:0;}
.srow.on .sbars{display:flex;}
.sbars span{display:block;width:3px;background:var(--accent);border-radius:2px;animation:bz .75s ease-in-out infinite;}
.sbars span:nth-child(1){height:5px;animation-delay:0s}
.sbars span:nth-child(2){height:13px;animation-delay:.12s}
.sbars span:nth-child(3){height:7px;animation-delay:.24s}
.sbars span:nth-child(4){height:15px;animation-delay:.36s}
@keyframes bz{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.srow-img{width:42px;height:42px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--s2);}
.srow-ph{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:var(--s2);
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.srow-meta{flex:1;min-width:0;}
.srow-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow-detail{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* spinner */
.spin{display:none;flex-direction:column;align-items:center;gap:14px;padding:60px 20px;}
.spin.on{display:flex;}
.spindot{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:sp .7s linear infinite;}
.spin p{font-size:12px;color:var(--muted);}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:44px;margin-bottom:14px;}
.empty p{font-size:13px;line-height:1.7;}

/* PLAYER */
#player{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:rgba(7,4,15,0.97);backdrop-filter:blur(28px);
  border-top:1px solid var(--border);
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.34,1.2,.64,1);
}
#player.open{transform:translateY(0);}
.ph{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);margin:10px auto 0;cursor:pointer;}

/* mini */
.pmini{display:flex;align-items:center;gap:11px;padding:10px 16px 12px;cursor:pointer;}
.pthumb{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:var(--s2);
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pmeta{flex:1;min-width:0;}
.ptitle{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.psub{font-size:11px;color:var(--muted);margin-top:1px;}
.pctrl{display:flex;gap:3px;align-items:center;}
.pb{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.pb:hover{background:var(--s2);}
.pb.pp{width:40px;height:40px;background:var(--accent);color:#fff;font-size:13px;}
.pb.pp:hover{background:#f0566e;}

/* expanded */
.pexp{display:none;padding:0 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
.pexp.on{display:block;}
.ytbox{border-radius:13px;overflow:hidden;background:#000;aspect-ratio:16/9;margin-bottom:14px;}
.ytbox iframe{width:100%;height:100%;border:none;display:block;}
.petitle{font-size:15px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.pesub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.pebtns{display:flex;gap:8px;}
.pbtn2{flex:1;padding:11px 8px;border-radius:11px;border:1px solid var(--border);background:var(--s2);
  color:var(--text);font-size:12px;font-family:'Noto Sans',sans-serif;cursor:pointer;transition:all .2s;text-align:center;}
.pbtn2:hover{background:rgba(255,255,255,.07);}
.pbtn2.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.pbtn2.pri:hover{background:#f0566e;}
</style>
</head>

// Try YouTube Data API directly (works on Vercel + any hosted domain)
// Falls back gracefully to search-embed mode if CORS blocked (e.g. preview sandboxes)
async function searchYouTube(query) {
  const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&videoCategoryId=10&q=${encodeURIComponent(query)}&key=${YT_KEY}`;
  try {
    const r = await fetch(apiUrl, { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.error || !data.items?.length) throw new Error('No results');
    const item = data.items[0];
    const id = item.id.videoId;
    return { id, thumb: item.snippet.thumbnails?.medium?.url || `https://img.youtube.com/vi/${id}/mqdefault.jpg`, useSearch: false };
  } catch(e) {
    // CORS blocked or quota — return search-embed fallback (always works)
    return { id: 'search', searchQ: query, thumb: null, useSearch: true };
  }
}

function fmtDur(s) {
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// State
let activeGenre = GENRES[0];
let activeSongs = []; // songs with resolved IDs
let activeIdx = -1;
let expanded = false;
let favs = JSON.parse(localStorage.getItem('sm_f')||'[]');
let resolvedCache = {}; // cache resolved songs per genre

// RENDER TABS
function renderTabs() {
  document.getElementById('tabs').innerHTML = GENRES.map(g => `
    <div class="tab ${g.id===activeGenre.id?'on':''}" data-id="${g.id}"
      ${g.id===activeGenre.id?`style="--gc:${g.color};--gg:${g.glow};"`:''}>
      ${g.emoji} ${g.label}
    </div>`).join('');
  document.querySelectorAll('.tab').forEach(t =>
    t.addEventListener('click', () => {
      activeGenre = GENRES.find(g => g.id === t.dataset.id);
      renderTabs();
      loadGenre();
    }));
}

// LOAD GENRE SONGS
async function loadGenre(searchOverride='') {
  const content = document.getElementById('content');
  const spin = document.getElementById('spin');
  content.innerHTML = '';
  spin.classList.add('on');

  const rawSongs = searchOverride
    ? Object.values(SONGS).flat().filter(s =>
        s.title.toLowerCase().includes(searchOverride.toLowerCase()) ||
        s.artist.toLowerCase().includes(searchOverride.toLowerCase()) ||
        (s.movie && s.movie.toLowerCase().includes(searchOverride.toLowerCase())))
    : SONGS[activeGenre.id] || [];

  // Show skeleton immediately
  spin.classList.remove('on');
  renderSongs(rawSongs.map(s => ({ ...s, id: null, thumb: null, resolving: true })));

  // Resolve IDs in background, one by one, updating UI as they come in
  activeSongs = rawSongs.map(s => ({ ...s, id: null, thumb: null }));
  activeIdx = -1;

  for (let i = 0; i < rawSongs.length; i++) {
    const s = rawSongs[i];
    const cacheKey = s.searchQ;
    if (resolvedCache[cacheKey]) {
      activeSongs[i] = { ...s, ...resolvedCache[cacheKey] };
    } else {
      const result = await searchYouTube(s.searchQ);
      if (result) {
        resolvedCache[cacheKey] = result;
        activeSongs[i] = { ...s, ...result };
      } else {
        // fallback: useSearch mode — always clickable
        activeSongs[i] = { ...s, id: 'search', thumb: null, useSearch: true };
      }
    }
    // Update only this card/row's thumbnail + enable click
    updateSongUI(i);
  }
}

// Update a single song's UI after resolution
function updateSongUI(i) {
  const s = activeSongs[i];
  const featured = i < 4;
  const el = document.querySelector(`[data-i="${i}"]`);
  if (!el) return;

  el.classList.remove('loading');

  // Always enable — either we have a real ID or we use search-embed fallback
  el.classList.add('ready');

  // Update thumbnail if we got a real one from API
  const ph = el.querySelector('.scard-ph, .srow-ph');
  if (ph && s.thumb) {
    const img = document.createElement('img');
    img.src = s.thumb;
    img.alt = s.title;
    img.onerror = () => { img.style.display='none'; };
    if (featured) {
      img.className = 'scard-img';
    } else {
      img.style.cssText = 'width:42px;height:42px;border-radius:9px;object-fit:cover;flex-shrink:0;';
    }
    ph.replaceWith(img);
  }

  // Show search-mode badge if no direct ID
  if (s.useSearch) {
    const badge = document.createElement('div');
    badge.style.cssText = 'position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:2px 5px;border-radius:4px;';
    badge.textContent = '▶ search';
    if (featured) { el.style.position='relative'; el.appendChild(badge); }
  }
}

// RENDER SONG LIST (skeleton)

    document.getElementById('content').innerHTML =

  }
  const feat = songs.slice(0, 4);
  const list = songs.slice(4);
  const g = activeGenre;

  document.getElementById('content').innerHTML = `
    <div class="slabel">${g.emoji} ${g.label} — Featured</div>
    <div class="strip">
      ${feat.map((s,i) => `
        <div class="scard loading" data-i="${i}" style="animation-delay:${i*.06}s;">
          <div class="scard-ph">${g.emoji}</div>
          <div class="scard-body">
            <div class="scard-title">${s.title}</div>
            <div class="scard-artist">${s.artist}</div>
          </div>
        </div>`).join('')}
    </div>

    <div class="slabel">🎵 All Songs</div>
    <div class="slist">
      ${list.map((s, i) => {
        const ii = i + 4;
        return `
        <div class="srow loading" data-i="${ii}" style="animation-delay:${i*.02}s;">
          <div class="snum">${ii + 1}</div>
          <div class="sbars"><span></span><span></span><span></span><span></span></div>
          <div class="srow-ph">${g.emoji}</div>
          <div class="srow-meta">
            <div class="srow-title">${s.title}</div>
            <div class="srow-detail">${s.artist}${s.movie ? ' · ' + s.movie : ''}</div>
          </div>
          <div class="sr-dur" style="font-size:11px;color:var(--dim);flex-shrink:0;"></div>
        </div>`;
      }).join('')}
    </div>`;

  document.querySelectorAll('.scard').forEach(el =>
    el.addEventListener('click', () => { const s=activeSongs[+el.dataset.i]; if(s?.id||s?.useSearch) playSong(+el.dataset.i); }));
  document.querySelectorAll('.srow').forEach(el =>
    el.addEventListener('click', () => { const s=activeSongs[+el.dataset.i]; if(s?.id||s?.useSearch) playSong(+el.dataset.i); }));
}

// PLAY
function playSong(i) {
  const s = activeSongs[i];
  if (!s) return;
  activeIdx = i;

  const pt = document.getElementById('pthumb');
  pt.innerHTML = s.thumb
    ? `<img src="${s.thumb}" style="width:100%;height:100%;object-fit:cover;display:block;"/>`
    : activeGenre.emoji;

  document.getElementById('ptitle').textContent = s.title;
  document.getElementById('psub').textContent = s.artist + (s.movie ? ' · ' + s.movie : '');
  document.getElementById('petitle').textContent = s.title;
  document.getElementById('pesub').textContent = s.artist + (s.movie ? ' · ' + s.movie : '') + ' · ' + activeGenre.label;

  // Use direct embed if we have a video ID, otherwise use YouTube search embed
  const embedSrc = s.useSearch
    ? `https://www.youtube.com/results?search_query=${encodeURIComponent(s.searchQ)}`
    : `https://www.youtube.com/embed/${s.id}?autoplay=1&rel=0&modestbranding=1`;

  // For search fallback — open YouTube directly in new tab since search results can't be iframed
  if (s.useSearch) {
    // Show player with open-in-youtube button, auto open
    document.getElementById('ytf').src = 'about:blank';
    document.getElementById('ppB').textContent = '▶';
    document.getElementById('player').classList.add('open');
    // Auto-expand and show open button
    if (!expanded) toggleExp();
    // Show a message in the iframe area
    document.querySelector('.ytbox').innerHTML = `
      <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:#0a0015;border-radius:13px;">
        <div style="font-size:36px;">${activeGenre.emoji}</div>
        <div style="font-size:14px;font-weight:600;text-align:center;">${s.title}</div>
        <div style="font-size:11px;color:rgba(255,255,255,.5);text-align:center;">${s.artist}</div>
        <button onclick="window.open('https://www.youtube.com/results?search_query=${encodeURIComponent(s.searchQ)}','_blank')"
          style="background:#e8445a;color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;">
          🎵 Play on YouTube ↗
        </button>
        <div style="font-size:10px;color:rgba(255,255,255,.3);">Opens YouTube with this exact song</div>
      </div>`;
  } else {
    document.querySelector('.ytbox').innerHTML = `<iframe id="ytf" src="${embedSrc}" allow="autoplay;encrypted-media" allowfullscreen style="width:100%;height:100%;border:none;display:block;"></iframe>`;
    document.getElementById('ppB').textContent = '⏸';
    document.getElementById('player').classList.add('open');
  }

  document.getElementById('favB').textContent = s.id && favs.includes(s.id) ? '❤️ Saved' : '🤍 Favourite';

  // highlight active song
  document.querySelectorAll('.scard,.srow').forEach(el =>
    el.classList.toggle('on', +el.dataset.i === i));
}

// CONTROLS
document.getElementById('prevB').addEventListener('click', e => {
  e.stopPropagation();
  for (let i = activeIdx - 1; i >= 0; i--) {
    const s = activeSongs[i];
    if (s?.id || s?.useSearch) { playSong(i); break; }
  }
});
document.getElementById('nextB').addEventListener('click', e => {
  e.stopPropagation();
  for (let i = activeIdx + 1; i < activeSongs.length; i++) {
    const s = activeSongs[i];
    if (s?.id || s?.useSearch) { playSong(i); break; }
  }
});
document.getElementById('ppB').addEventListener('click', e => {
  e.stopPropagation();
  const f = document.getElementById('ytf');
  if (f.src.includes('autoplay=1')) {
    f.src = f.src.replace('autoplay=1','autoplay=0');
    document.getElementById('ppB').textContent = '▶';
  } else {
    f.src = f.src.replace('autoplay=0','autoplay=1');
    document.getElementById('ppB').textContent = '⏸';
  }
});

function toggleExp() {
  expanded = !expanded;
  document.getElementById('pexp').classList.toggle('on', expanded);
  document.getElementById('expB').textContent = expanded ? '🔽' : '🔼';
}
document.getElementById('expB').addEventListener('click', e => { e.stopPropagation(); toggleExp(); });
document.getElementById('ph').addEventListener('click', toggleExp);
document.getElementById('pmini').addEventListener('click', toggleExp);

document.getElementById('ytB').addEventListener('click', () => {
  const s = activeSongs[activeIdx];
  if (s?.id) window.open(`https://youtu.be/${s.id}`, '_blank');
});
document.getElementById('shareB').addEventListener('click', () => {
  const s = activeSongs[activeIdx];
  if (!s?.id) return;
  const url = `https://youtu.be/${s.id}`;
  if (navigator.share) navigator.share({ title: s.title, text: s.artist, url });
  else { navigator.clipboard.writeText(url); alert('Link copied!'); }
});
document.getElementById('favB').addEventListener('click', () => {
  const s = activeSongs[activeIdx];
  if (!s?.id) return;
  const i = favs.indexOf(s.id);
  if (i >= 0) { favs.splice(i,1); document.getElementById('favB').textContent = '🤍 Favourite'; }
  else { favs.push(s.id); document.getElementById('favB').textContent = '❤️ Saved'; }
  localStorage.setItem('sm_f', JSON.stringify(favs));
});

document.getElementById('searchInput').addEventListener('input', e => {
