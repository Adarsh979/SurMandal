<style>
:root{
  --bg:#07040f;--s1:#0f0919;--s2:#160e26;--card:#120b20;
  --border:rgba(255,255,255,0.07);--text:#eee8ff;
  --muted:rgba(238,232,255,0.42);--dim:rgba(238,232,255,0.18);
  --accent:#e8445a;--gold:#f0c040;--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.o{position:absolute;border-radius:50%;filter:blur(100px);opacity:.09;}
.o1{width:550px;height:550px;background:#e8445a;top:-150px;left:-180px;animation:da 22s ease-in-out infinite;}
.o2{width:450px;height:450px;background:#7c3aed;bottom:-100px;right:-120px;animation:db 26s ease-in-out infinite;}
.o3{width:300px;height:300px;background:#f0c040;top:40%;left:30%;animation:dc 18s ease-in-out infinite;}
@keyframes da{0%,100%{transform:translate(0,0)}50%{transform:translate(55px,38px)}}
@keyframes db{0%,100%{transform:translate(0,0)}50%{transform:translate(-48px,-30px)}}
@keyframes dc{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,44px)}}

.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;padding-bottom:180px;}

header{position:sticky;top:0;z-index:200;background:rgba(7,4,15,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 16px 0;}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;background:linear-gradient(110deg,#f0c040,#e8445a,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.bsub{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:1px;}

.sbox{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;margin-bottom:13px;}
.sbox input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:'Noto Sans',sans-serif;}
.sbox input::placeholder{color:var(--dim);}
#clearBtn{color:var(--dim);cursor:pointer;font-size:13px;display:none;line-height:1;flex-shrink:0;}

.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:13px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:100px;border:1px solid var(--border);background:var(--s2);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .2s;white-space:nowrap;}
.tab:hover{color:var(--text);border-color:rgba(255,255,255,0.15);}
.tab.on{color:#fff;border-color:transparent;background:var(--gc,#e8445a);box-shadow:0 0 18px var(--gg,rgba(232,68,90,.4));}

main{padding:18px 16px 8px;}
.slabel{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

/* featured strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:24px;scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}

.scard{flex-shrink:0;width:130px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:fu .4s ease both;position:relative;}
.scard:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(0,0,0,.5);}
.scard.on{border-color:var(--accent) !important;box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(232,68,90,.3) !important;}
.scard.loading .scard-body{opacity:.5;}
.card-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2);}
.card-ph{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),var(--s1));display:flex;align-items:center;justify-content:center;font-size:28px;}
.scard-body{padding:8px 9px 10px;}
.scard-title{font-size:11px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.scard-ytitle{font-size:9.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-style:italic;}

/* loading shimmer */
.shimmer{background:linear-gradient(90deg,var(--s2) 25%,var(--s1) 50%,var(--s2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* song list */
.slist{display:flex;flex-direction:column;gap:1px;}
.srow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .15s;animation:fu .3s ease both;border:1px solid transparent;}
.srow:hover{background:var(--s2);}
.srow.on{background:rgba(232,68,90,.08);border-color:rgba(232,68,90,.2);}
.srow.loading{opacity:.6;pointer-events:none;}
.snum{width:22px;text-align:center;font-size:12px;color:var(--dim);flex-shrink:0;}
.srow.on .snum{display:none;}
.sbars{display:none;gap:2px;align-items:flex-end;height:16px;width:22px;flex-shrink:0;}
.srow.on .sbars{display:flex;}
.sbars span{display:block;width:3px;background:var(--accent);border-radius:2px;animation:bz .75s ease-in-out infinite;}
.sbars span:nth-child(1){height:5px;animation-delay:0s}
.sbars span:nth-child(2){height:13px;animation-delay:.12s}
.sbars span:nth-child(3){height:7px;animation-delay:.24s}
.sbars span:nth-child(4){height:15px;animation-delay:.36s}
@keyframes bz{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.row-thumb{width:42px;height:42px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--s2);}
.row-ph{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;}
.srow-meta{flex:1;min-width:0;}
.srow-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.srow-ytitle{font-size:10px;color:rgba(238,232,255,0.3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;}
.srow-detail{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:44px;margin-bottom:14px;}
.empty p{font-size:13px;line-height:1.7;}

/* status bar */
.status{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(240,192,64,0.07);border:1px solid rgba(240,192,64,0.15);border-radius:10px;margin-bottom:16px;font-size:11px;color:rgba(240,192,64,0.7);}
.status.ok{background:rgba(22,163,74,0.07);border-color:rgba(22,163,74,0.15);color:rgba(134,239,172,0.7);}
.status.err{background:rgba(232,68,90,0.07);border-color:rgba(232,68,90,0.15);color:rgba(255,150,160,0.8);}
#statusBar{display:none;}

/* PLAYER */
#player{position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(7,4,15,0.97);backdrop-filter:blur(28px);border-top:1px solid var(--border);transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.2,.64,1);}
#player.open{transform:translateY(0);}
.ph{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);margin:10px auto 0;cursor:pointer;}
.pmini{display:flex;align-items:center;gap:11px;padding:10px 16px 12px;cursor:pointer;}
.pthumb{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pmeta{flex:1;min-width:0;}
.ptitle{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.psub{font-size:11px;color:var(--muted);margin-top:1px;}
.pctrl{display:flex;gap:3px;align-items:center;}
.pb{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.pb:hover{background:var(--s2);}
.pb.pp{width:40px;height:40px;background:var(--accent);color:#fff;font-size:13px;}
.pb.pp:hover{background:#f0566e;}
.pexp{display:none;padding:0 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
.pexp.on{display:block;}
.ytbox{border-radius:13px;overflow:hidden;background:#000;aspect-ratio:16/9;margin-bottom:14px;}
.ytbox iframe{width:100%;height:100%;border:none;display:block;}
.petitle{font-size:14px;font-weight:700;margin-bottom:2px;line-height:1.3;}
.pesub{font-size:11px;color:var(--muted);margin-bottom:14px;}
.pebtns{display:flex;gap:8px;}
.pbtn2{flex:1;padding:11px 8px;border-radius:11px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-size:12px;font-family:'Noto Sans',sans-serif;cursor:pointer;transition:all .2s;text-align:center;}
.pbtn2:hover{background:rgba(255,255,255,.07);}
.pbtn2.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
</style>
</head>

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let genre = GENRES[0];
let songs = [];        // resolved songs for current view
let idx = -1;
let expanded = false;
let favs = JSON.parse(localStorage.getItem('sm_f')||'[]');
let cache = {};        // q -> {id, thumb, ytTitle}
let searchMode = false;

// Flat list for search
const allCatalog = Object.entries(CATALOG).flatMap(([gid,list]) =>
  list.map(s => ({...s, genreId: gid})));

// ─────────────────────────────────────────────────────────────
// SEARCH via /api/search (serverless) or YouTube API directly
// ─────────────────────────────────────────────────────────────
async function ytSearch(q) {
  if (cache[q]) return cache[q];

  // Try /api/search serverless first (works on Vercel, key is server-side)
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`, {signal: AbortSignal.timeout(10000)});
    const data = await r.json();
    if (data?.id) {
      cache[q] = {id: data.id, thumb: data.thumb, ytTitle: data.title};
      return cache[q];
    }
    if (data?.error) console.warn('API route error:', data.error, 'code:', data.code);
  } catch(e) {
    console.warn('Serverless route failed (normal in local preview):', e.message);
  }

  // Fallback: call YouTube directly from browser
  // Works when key has NO restrictions or "HTTP referrers" includes this domain
  try {
    const key = 'AIzaSyCFHRCWImY1thLi20nBSZpgMGW3UBfRfYg';
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&videoCategoryId=10&q=${encodeURIComponent(q)}&key=${key}`;
    const r = await fetch(url, {signal: AbortSignal.timeout(10000)});
    const data = await r.json();
    if (data?.error) {
      console.warn('Direct YT API error:', data.error.message, '| code:', data.error.code);
      // Show helpful message on 403
      if (data.error.code === 403) {
        window._ytApiError = data.error.message;
      }
      return null;
    }
    if (data?.items?.length) {
      const item = data.items[0];
      const result = {
        id: item.id.videoId,
        thumb: item.snippet.thumbnails?.medium?.url,
        ytTitle: item.snippet.title,
      };
      cache[q] = result;
      return result;
    }
  } catch(e) {
    console.warn('Direct YT API fetch failed:', e.message);
  }

  return null;
}

// ─────────────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById('tabs').innerHTML = GENRES.map(g => `
    <div class="tab ${g.id===genre.id?'on':''}" data-id="${g.id}"
      ${g.id===genre.id?`style="--gc:${g.color};--gg:${g.glow};"`:''}>
      ${g.emoji} ${g.label}
    </div>`).join('');
  document.querySelectorAll('.tab').forEach(t =>
    t.addEventListener('click', () => {
      genre = GENRES.find(g => g.id===t.dataset.id);
      searchMode = false;
      document.getElementById('searchInput').value = '';
      document.getElementById('clearBtn').style.display = 'none';
      renderTabs();
      loadSongs(CATALOG[genre.id]);
    }));
}

// ─────────────────────────────────────────────────────────────
// LOAD SONGS — render skeletons then resolve IDs one by one
// ─────────────────────────────────────────────────────────────
async function loadSongs(catalog) {
  if (!catalog?.length) {
    document.getElementById('content').innerHTML =
      `<div class="empty"><div class="ei">🔍</div><p>No songs found.</p></div>`;
    return;
  }

  // Reset
  songs = catalog.map(s => ({...s, id: null, thumb: null, ytTitle: null, loading: true}));
  idx = -1;
  renderSongs();

  setStatus('loading', `⏳ Loading ${catalog.length} songs…`);

  let loaded = 0, failed = 0;

  // Resolve all in parallel — batches of 4 to avoid rate limit
  for (let i = 0; i < songs.length; i += 4) {
    const batch = songs.slice(i, i+4).map((s,j) => {
      const ii = i+j;
      return ytSearch(s.q).then(result => {
        if (result?.id) {
          songs[ii] = {...s, ...result, loading: false};
          loaded++;
        } else {
          songs[ii] = {...s, loading: false, failed: true};
          failed++;
        }
        updateCard(ii);
        setStatus('loading', `⏳ Loading… ${loaded+failed}/${songs.length}`);
      });
    });
    await Promise.all(batch);
  }

  if (failed === songs.length) {
    const hint = window._ytApiError
      ? `❌ API error: ${window._ytApiError.slice(0,80)}`
      : '❌ Could not load. Fix: Go to Google Cloud Console → your API key → Application Restrictions → set to "None" or add your Vercel domain';
    setStatus('err', hint);
  } else if (failed > 0) {
    setStatus('ok', `✅ ${loaded} songs ready · ${failed} unavailable in your region`);
  } else {
    setStatus('ok', `✅ ${loaded} songs ready`);
    setTimeout(() => document.getElementById('statusBar').style.display='none', 3000);
  }
}

function setStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  bar.style.display = 'flex';
  bar.className = `status ${type}`;
  document.getElementById('statusMsg').textContent = msg;
}

// ─────────────────────────────────────────────────────────────
// RENDER — skeletons first, update progressively
// ─────────────────────────────────────────────────────────────
function renderSongs() {
  const g = genre;
  const feat = songs.slice(0, 4);
  const list = songs.slice(4);

  document.getElementById('content').innerHTML = `
    <div class="slabel">${g.emoji} ${g.label} — Featured</div>
    <div class="strip" id="featStrip">
      ${feat.map((s,i) => `
        <div class="scard loading" data-i="${i}" style="animation-delay:${i*.06}s">
          <div class="card-ph shimmer" id="cph${i}">${g.emoji}</div>
          <div class="scard-body">
            <div class="scard-title">${s.title}</div>
            <div class="scard-ytitle" id="cytitle${i}"></div>
          </div>
        </div>`).join('')}
    </div>

    <div class="slabel">🎵 All Songs (${songs.length})</div>
    <div class="slist" id="songList">
      ${list.map((s,i) => {
        const ii = i+4;
        return `
        <div class="srow loading" data-i="${ii}" style="animation-delay:${i*.025}s">
          <div class="snum">${ii+1}</div>
          <div class="sbars"><span></span><span></span><span></span><span></span></div>
          <div class="row-ph" id="rph${ii}">${g.emoji}</div>
          <div class="srow-meta">
            <div class="srow-title">${s.title}</div>
            <div class="srow-detail">${s.artist}${s.movie?' · '+s.movie:''}</div>
            <div class="srow-ytitle" id="ryt${ii}"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  attachClicks();
}

function updateCard(i) {
  const s = songs[i];
  const el = document.querySelector(`[data-i="${i}"]`);
  if (!el) return;

  el.classList.remove('loading');

  if (s.failed) {
    el.style.opacity = '0.35';
    el.style.pointerEvents = 'none';
    el.title = 'Not available';
    return;
  }

  if (!s.id) return;

  const featured = i < 4;

  if (featured) {
    // Replace shimmer placeholder with real thumbnail
    const ph = document.getElementById(`cph${i}`);
    if (ph) {
      const img = document.createElement('img');
      img.className = 'card-thumb';
      img.src = s.thumb || `https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;
      img.alt = s.title;
      img.onerror = () => { img.src = `https://img.youtube.com/vi/${s.id}/mqdefault.jpg`; };
      ph.replaceWith(img);
    }
    // Show actual YouTube title if different
    const yt = document.getElementById(`cytitle${i}`);
    if (yt && s.ytTitle) yt.textContent = s.ytTitle;
  } else {
    // Row thumbnail
    const ph = document.getElementById(`rph${i}`);
    if (ph) {
      const img = document.createElement('img');
      img.className = 'row-thumb';
      img.src = s.thumb || `https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;
      img.alt = s.title;
      img.onerror = () => { img.src = `https://img.youtube.com/vi/${s.id}/mqdefault.jpg`; };
      ph.replaceWith(img);
    }
    const yt = document.getElementById(`ryt${i}`);
    if (yt && s.ytTitle) yt.textContent = s.ytTitle;
  }

  attachClicks();
}

function attachClicks() {
  document.querySelectorAll('.scard:not(.loading):not([data-bound])').forEach(el => {
    el.dataset.bound = '1';
    el.addEventListener('click', () => {
      const s = songs[+el.dataset.i];
      if (s?.id) play(+el.dataset.i);
    });
  });
  document.querySelectorAll('.srow:not(.loading):not([data-bound])').forEach(el => {
    el.dataset.bound = '1';
    el.addEventListener('click', () => {
      const s = songs[+el.dataset.i];
      if (s?.id) play(+el.dataset.i);
    });
  });
}

// ─────────────────────────────────────────────────────────────
// PLAY
// ─────────────────────────────────────────────────────────────
function play(i) {
  const s = songs[i];
  if (!s?.id) return;
  idx = i;

  document.getElementById('pthumb').innerHTML =
    `<img src="${s.thumb||`https://img.youtube.com/vi/${s.id}/hqdefault.jpg`}"
      onerror="this.parentNode.textContent='${genre.emoji}'"
      style="width:100%;height:100%;object-fit:cover;display:block;"/>`;

  document.getElementById('ptitle').textContent = s.title;
  document.getElementById('psub').textContent = s.artist + (s.movie?' · '+s.movie:'');
  document.getElementById('petitle').textContent = s.title;
  document.getElementById('pesub').textContent = (s.ytTitle||s.artist) + (s.movie?' · '+s.movie:'');

  document.getElementById('ytbox').innerHTML =
    `<iframe src="https://www.youtube.com/embed/${s.id}?autoplay=1&rel=0&modestbranding=1"
      allow="autoplay;encrypted-media" allowfullscreen
      style="width:100%;height:100%;border:none;display:block;"></iframe>`;

  document.getElementById('ppB').textContent = '⏸';
  document.getElementById('player').classList.add('open');
  document.getElementById('favB').textContent = favs.includes(s.id) ? '❤️ Saved' : '🤍 Favourite';

  document.querySelectorAll('.scard,.srow').forEach(el =>
    el.classList.toggle('on', +el.dataset.i === i));
}

// ─────────────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────────────
document.getElementById('prevB').addEventListener('click', e => {
  e.stopPropagation();
  for (let i=idx-1; i>=0; i--) { if(songs[i]?.id){play(i);break;} }
});
document.getElementById('nextB').addEventListener('click', e => {
  e.stopPropagation();
  for (let i=idx+1; i<songs.length; i++) { if(songs[i]?.id){play(i);break;} }
});
document.getElementById('ppB').addEventListener('click', e => {
  e.stopPropagation();
  const f = document.querySelector('#ytbox iframe');
  if (!f) return;
  if (f.src.includes('autoplay=1')) {
    f.src = f.src.replace('autoplay=1','autoplay=0');
    document.getElementById('ppB').textContent = '▶';
  } else {
    f.src = f.src.replace('autoplay=0','autoplay=1');
    document.getElementById('ppB').textContent = '⏸';
  }
});

function toggleExp() {
  expanded = !expanded;
  document.getElementById('pexp').classList.toggle('on', expanded);
  document.getElementById('expB').textContent = expanded ? '🔽' : '🔼';
}
document.getElementById('expB').addEventListener('click', e => { e.stopPropagation(); toggleExp(); });
document.getElementById('ph').addEventListener('click', toggleExp);
document.getElementById('pmini').addEventListener('click', toggleExp);

document.getElementById('ytB').addEventListener('click', () => {
  const s = songs[idx];
  if (s?.id) window.open(`https://youtu.be/${s.id}`, '_blank');
});
document.getElementById('shareB').addEventListener('click', () => {
  const s = songs[idx];
  if (!s?.id) return;
  const url = `https://youtu.be/${s.id}`;
  if (navigator.share) navigator.share({title:s.title, text:s.artist, url});
  else { navigator.clipboard?.writeText(url).then(()=>alert('Link copied!')); }
});
document.getElementById('favB').addEventListener('click', () => {
  const s = songs[idx];
  if (!s?.id) return;
  const i = favs.indexOf(s.id);
  if (i>=0) { favs.splice(i,1); document.getElementById('favB').textContent='🤍 Favourite'; }
  else { favs.push(s.id); document.getElementById('favB').textContent='❤️ Saved'; }
  localStorage.setItem('sm_f', JSON.stringify(favs));
});

// ─────────────────────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────────────────────
let st;
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none';
  clearTimeout(st);
  if (!q) { searchMode=false; renderTabs(); loadSongs(CATALOG[genre.id]); return; }
  st = setTimeout(() => {
    searchMode = true;
    const results = allCatalog.filter(s =>
      s.title.toLowerCase().includes(q.toLowerCase()) ||
      s.artist.toLowerCase().includes(q.toLowerCase()) ||
      s.movie.toLowerCase().includes(q.toLowerCase()));
    loadSongs(results);
  }, 350);
});
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  searchMode = false;
  loadSongs(CATALOG[genre.id]);
});

// ─────────────────────────────────────────────────────────────
// PWA + INIT
// ─────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

renderTabs();
loadSongs(CATALOG[genre.id]);
</script>
